<header class="site-header">
  <div class="site-header__container">
    <div class="site-header__left">
      <a class="site-header__logo" href="/" aria-label="ClickTik home">
        <app-logo size="sm" />
        <span class="site-header__logo-text">ClickTik</span>
      </a>
      <nav class="site-header__nav" aria-label="Primary">
        <a class="site-header__nav-link" href="/">Home</a>
      </nav>
    </div>

    <div class="site-header__right">
      @if (authStore.isAuthenticated()) {
        <form class="site-header__search" role="search" (submit)="onSearchSubmit($event)">
          <label class="sr-only" for="header-search">Search products</label>
          <img class="site-header__search-icon" src="images/Shape.png" alt="" aria-hidden="true" width="17" height="17" />
          <input
            id="header-search"
            class="site-header__search-input"
            type="search"
            placeholder="Search"
            [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)"
          />
        </form>
        <app-cart-badge [count]="cartStore.count()" />
        <app-button class="site-header__account" variant="tertiary-gray" size="lg" [fullWidth]="true">
          Account
        </app-button>

        <app-cart-badge [count]="cartStore.count()" />
      } @else {
        <app-button variant="tertiary-gray" size="lg">Log In</app-button>
      }
    </div>
  </div>
</header>
